<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pagina simple</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<header>
		<h1>Mi Sitio</h1>
	</header>
	<nav>
		<a href="#catalogo">Catalogo</a>
		<a href="#contacto">Contacto</a>
	</nav>

	<main>
		<section id="catalogo">
			<h2>Catalogo</h2>
			<div class="articulos">
				<article>
					<h3>Articulo 1</h3>
					<img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=360&q=80"
						alt="Paisaje de montanas con lago">
					<p>Contenido breve del primer articulo.</p>
				</article>
				<article>
					<h3>Articulo 2</h3>
					<img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=360&q=80"
						alt="Playa con agua turquesa">
					<p>Contenido breve del segundo articulo.</p>
				</article>
				<article>
					<h3>Articulo 3</h3>
					<img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=360&q=80"
						alt="Playa con agua turquesa">
					<p>Contenido breve del tercer articulo.</p>
				</article>
			</div>
		</section>
	</main>

	<footer id="contacto">
		<p>2026 - Mi Sitio</p>
	</footer>
</body>

</html>
