<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Version semantica simple</title>
</head>
<body>
	<header>
		<h1>Mi Tienda</h1>
	</header>
	<nav>
		<a href="#">Inicio</a>
		<a href="#catalogo">Catalogo</a>
		<a href="#">Contacto</a>
	</nav>
	<main>
		<section id="catalogo">
			<article>
				<h2>Producto A</h2>
				<p>Descripcion corta del producto.</p>
				<img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80" alt="Imagen del producto A">
				<label for="cantidad">Cantidad:</label>
				<input type="number" id="cantidad" name="cantidad" min="1" placeholder="Ejemplo: 1">
			</article>
		</section>
	</main>
	<footer>
		<p>2026 - Mi Tienda</p>
	</footer>
</body>
</html>
